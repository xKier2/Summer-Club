<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LumeoLMS</title>
    <link rel="stylesheet" href="/css/output.css">

    <script src="../Services/Login_func.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }
        .text-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased h-screen w-full flex items-center justify-center">

    <div class="flex h-full w-full bg-white shadow-2xl overflow-hidden">

        <div class="flex w-full lg:w-1/2 flex-col justify-center bg-white px-8 md:px-20 lg:px-32 relative z-10">

            <div class="absolute top-8 left-8 md:top-12 md:left-12">
                <a th:href="@{/}" class="group flex items-center gap-3 text-slate-400 hover:text-violet-600 transition-all duration-300">
                    <div class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-100 group-hover:border-violet-200 group-hover:bg-violet-50 transition-all shadow-sm">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-[0.2em] hidden sm:block">Back to Home</span>
                </a>
            </div>

            <div class="w-full max-w-md mx-auto">
                <div class="mb-10">
                    <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 mb-4">Welcome back!</h1>
                    <p class="text-slate-500 text-lg">Simplify your workflow with <span class="font-bold text-violet-600">Lumeo</span>. Get started for free.</p>
                </div>

                <form th:action="@{/dashboard}" method="post" class="space-y-5">
                    <div>
                        <input type="text" name="username" placeholder="Username" required
                               class="w-full rounded-full border border-slate-200 bg-slate-50 px-8 py-5 text-lg outline-none transition-all focus:border-violet-400 focus:ring-4 focus:ring-violet-100">
                    </div>

                    <div class="relative">
                        <input type="password" name="password" placeholder="Password" required
                               class="w-full rounded-full border border-slate-200 bg-slate-50 px-8 py-5 text-lg outline-none transition-all focus:border-violet-400 focus:ring-4 focus:ring-violet-100">
                        <button type="button" class="absolute right-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-violet-600">
                            <i class="fa-regular fa-eye-slash text-xl"></i>
                        </button>
                    </div>

                    <div class="flex justify-start">
                        <a href="#" class="text-xs font-bold text-slate-700 hover:text-violet-600 uppercase tracking-wider">Forgot Password?</a>
                    </div>

                    <button type="submit"
                            class="btn-gradient inline-block text-center w-full rounded-full py-5 text-xl font-bold text-white transition-all hover:opacity-90 active:scale-[0.98] shadow-xl shadow-purple-200 cursor-pointer">
                        Login
                    </button>
                </form>

                <div class="relative my-10 text-center">
                    <span class="relative z-10 bg-white px-6 text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">or continue with</span>
                    <div class="absolute inset-0 top-1/2 h-px w-full -translate-y-1/2 bg-slate-100"></div>
                </div>

                <div class="flex justify-center gap-6">
                    <button class="flex h-14 w-14 items-center justify-center rounded-full border border-slate-100 shadow-sm transition-all hover:bg-slate-50 hover:border-violet-200">
                        <i class="fa-brands fa-google text-2xl text-slate-700"></i>
                    </button>
                    <button class="flex h-14 w-14 items-center justify-center rounded-full border border-slate-100 shadow-sm transition-all hover:bg-slate-50 hover:border-violet-200">
                        <i class="fa-brands fa-apple text-3xl text-slate-700"></i>
                    </button>
                    <button class="flex h-14 w-14 items-center justify-center rounded-full border border-slate-100 shadow-sm transition-all hover:bg-slate-50 hover:border-violet-200">
                        <i class="fa-brands fa-facebook text-3xl text-slate-700"></i>
                    </button>
                </div>

                <p class="mt-12 text-center text-slate-600">
                    Not a member? <a th:href="@{/register}" class="font-bold text-violet-600 hover:underline">Register now</a>
                </p>
            </div>
        </div>

        <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-violet-50 via-white to-pink-50 flex-col items-center justify-center p-20 relative overflow-hidden">

            <div class="absolute top-0 right-0 w-64 h-64 bg-purple-100 rounded-full blur-3xl opacity-50 -mr-20 -mt-20"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-100 rounded-full blur-3xl opacity-50 -ml-20 -mb-20"></div>

            <div id="carousel-container" class="relative z-10 w-full max-w-lg flex flex-col items-center transition-all duration-700 ease-in-out">
                <div class="w-full h-[500px] flex items-center justify-center mb-12">
                    <img id="carousel-image" th:src="@{/Images/Login_Page/Graduation-bro.svg}"
                         alt="LMS Illustration" class="w-full h-full object-contain transition-opacity duration-500 opacity-100 drop-shadow-2xl">
                </div>

                <div class="text-center px-10">
                    <h2 id="carousel-text" class="text-3xl font-bold text-slate-800 leading-snug transition-opacity duration-500 opacity-100">
                        Unlock your potential with <span class="text-gradient">Lumeo's</span> advanced learning tools.
                    </h2>

                    <div class="mt-8 flex justify-center gap-3">
                        <div id="dot-0" class="h-2 w-8 rounded-full bg-violet-600 transition-all duration-300"></div>
                        <div id="dot-1" class="h-2 w-2 rounded-full bg-slate-300 transition-all duration-300"></div>
                        <div id="dot-2" class="h-2 w-2 rounded-full bg-slate-300 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
