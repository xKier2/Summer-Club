<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lumeo Dashboard</title>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-background text-foreground font-sans">

<div class="flex min-h-screen">

    <aside th:replace="~{fragments :: sidebar}"></aside>

    <main class="flex-1 p-8 bg-[#FDF8F6]"> <header class="flex justify-between items-center mb-8">
        <div>
            <p class="text-sm text-muted-foreground">Hello,</p>
            <h1 class="text-xl font-bold">Mr. Kier Gabriel</h1>
        </div>
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 bg-gray-200 rounded-full"></div> </div>
    </header>

        <div class="grid grid-cols-3 gap-6">

            <div class="col-span-2 space-y-6">
                <div class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-[2.5rem] py-20 px-12 text-white relative overflow-hidden flex justify-between items-center min-h-[320px]">

                    <div class="relative z-10">
                        <span class="bg-white/20 backdrop-blur-md px-5 py-2 rounded-full text-sm font-medium flex items-center gap-2 w-fit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                            Have a great day
                        </span>

                        <h2 class="text-5xl font-extrabold mt-8 tracking-tight">Hi Kier,</h2>
                        <p class="mt-4 text-white/90 text-xl max-w-md leading-relaxed">
                            Welcome back! Don't forget to learn something today.
                        </p>
                    </div>

                    <div class="relative z-10 flex gap-6 mr-8">
                        <div class="w-20 h-20 bg-[#FFD633] rounded-[1.5rem] flex items-center justify-center shadow-2xl transform -rotate-12 hover:rotate-0 transition-transform duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#664d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                        </div>
                        <div class="w-20 h-20 bg-[#4ADE80] rounded-[1.5rem] flex items-center justify-center shadow-2xl transform rotate-12 hover:rotate-0 transition-transform duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-0.5-5.1"/><path d="M6.5 17.5h13.5"/></svg>
                        </div>
                    </div>

                    <div class="absolute -right-20 -top-20 w-96 h-96 bg-white/20 rounded-full blur-3xl"></div>
                </div>
                <div class="bg-white rounded-3xl p-6 shadow-sm min-h-75 border border-dashed border-gray-200 flex flex-col items-center justify-center">
                    <p class="text-muted-foreground">No courses enrolled</p>
                    <button class="mt-4 px-6 py-2 bg-indigo-500 text-white rounded-full text-sm">Head to courses tab</button>
                </div>
            </div>

            <div class="col-span-1 space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                    <h3 class="font-bold mb-4">Today's Schedule</h3>
                    <div class="text-center py-8">
                        <p class="text-sm font-semibold">Clear skies today</p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                    <h3 class="font-bold mb-4">To-Do</h3>
                    <div class="text-center py-8">
                        <p class="text-sm font-semibold text-green-600">All clear</p>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

</body>
</html>
